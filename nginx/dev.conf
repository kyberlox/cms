# Development server block. Mounted as /etc/nginx/conf.d/default.conf.
# Listens on :80 inside the dev nginx container (mapped to host :8080).
# Routes /api/* to the FastAPI backend and everything else to the Astro client.
server {
    listen 80;
    server_name localhost;

    # Attachments uploads (mirrors UPLOAD_SIZE_LIMIT; raise if you increase it)
    client_max_body_size 20m;

    # API, uploads, OpenAPI docs -> FastAPI backend (http://deepsel:8000)
    location /api/ {
        proxy_pass http://deepsel:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Public site + admin UI -> Astro client spawned by the backend
    # (http://deepsel:4321). Includes websocket upgrade headers (HMR).
    location / {
        proxy_pass http://deepsel:4321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}