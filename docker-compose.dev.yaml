name: deepsel-dev

services:
  # ------------------------------------------------------------------ PostgreSQL
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432" # expose for local tools (psql, DBeaver, ...)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [default]

  # ------------------------------------------------------------------- Deepsel
  deepsel:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepsel:dev
    restart: unless-stopped
    env_file: .env
    environment:
      # Dev overrides — see .env.example for the prod values.
      RUN_MIGRATIONS: "true"
      UVICORN_ARGS: "--reload"
      FRONTEND_URL: "http://localhost:8080"
      CORS_ALLOWED_ORIGINS: "http://localhost:8080,http://localhost:5173"
      SESSION_COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    # Bind-mount the whole repo so Python/reload sees your latest code.
    volumes:
      - .:/app
      - deepsel-data:/root/.local/share/deepsel-cms
      - deepsel-files:/app/files
    ports:
      - "8000:8000" # FastAPI backend directly (API, OpenAPI docs at /)
      - "4321:4321" # Astro CMS client directly (spawned by the backend)
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/openapi.json', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      start_period: 900s
      retries: 5
    networks: [default]

  # --------------------------------------------------------------------- nginx
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - deepsel
    ports:
      - "8080:80" # same proxy shape as prod, but on :8080 to avoid clashing
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [default]

volumes:
  pgdata:
  deepsel-data:
  deepsel-files: