name: deepsel

# =============================================================================
# Deepsel CMS — production stack (db, deepsel, nginx, certbot).
#
# Designed to run with zero manual config:
#   * no .env file is strictly required (defaults in `environment` below),
#   * `make setup` / `make deploy` generate .env automatically with random
#     secrets when it is missing,
#   * DB_HOST/DB_PORT are forced to the internal service name `db` so a wrong
#     value in .env can never break the database connection,
#   * the deepsel container self-provisions the DB role/database/grants
#     (docker/db_ensure.py) so POSTGRES_USER vs DB_USER mismatches don't matter,
#   * `make ssl-init` fetches the real Let's Encrypt certificate; `make deploy`
#     already starts the stack behind a self-signed TLS cert so nothing blocks.
# =============================================================================

services:
  # ------------------------------------------------------------------ PostgreSQL
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deepsel}
      POSTGRES_USER: ${POSTGRES_USER:-deepsel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deepsel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deepsel} -d ${POSTGRES_DB:-deepsel}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [default]

  # ------------------------------------------------------------------- Deepsel
  # FastAPI backend (8000) which ALSO builds and spawns the Astro CMS client
  # (4321) inside the same container (see deepsel/apps/cms/utils/client_process.py).
  deepsel:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepsel:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Forced: inside compose the DB always lives at `db:5432`. A typo'd
      # DB_HOST in .env can't break the connection anymore; db_ensure.py handles
      # the rest (role / database / grants).
      DB_HOST: db
      DB_PORT: "5432"
      # Sensible defaults so the stack boots even with no / sparse .env.
      DB_NAME: ${DB_NAME:-deepsel}
      DB_USER: ${DB_USER:-deepsel}
      DB_PASSWORD: ${DB_PASSWORD:-deepsel}
      APP_SECRET: ${APP_SECRET:-change-me-in-.env}
      INSTALLED_APPS: ${INSTALLED_APPS:-core,cms}
      APP_DIRS: ${APP_DIRS:-apps,deepsel.apps}
      FILESYSTEM: ${FILESYSTEM:-local}
      SESSION_STORE: ${SESSION_STORE:-postgres}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persistent data dir (platformdirs user_data_dir): built client,
      # themes, org overlays. Keeps re-deploys from re-running npm install.
      - deepsel-data:/root/.local/share/deepsel-cms
      # FILESYSTEM=local attachment storage (deepsel/orm/attachment_mixin.py)
      - deepsel-files:/app/files
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/openapi.json', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      start_period: 900s
      retries: 10
    networks: [default]

  # --------------------------------------------------------------------- nginx
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - deepsel
    environment:
      # Rendered into /etc/nginx/conf.d/default.conf via the official image's
      # envsubst-on-templates hook (nginx/prod.conf.template).
      DOMAIN: ${DOMAIN:-cms.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-certs-data:/var/lib/letsencrypt:ro
    networks: [default]

  # ------------------------------------------------------------------- certbot
  # Auto-renews certificates (checks every 12h). The FIRST certificate is
  # obtained with `make ssl-init` (see Makefile / README).
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
      - certbot-certs-data:/var/lib/letsencrypt
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --non-interactive; sleep 12h & wait $${!}; done;'
    networks: [default]

volumes:
  pgdata:
  deepsel-data:
  deepsel-files:
  certbot-www:
  certbot-certs:
  certbot-certs-data: